# Complete the interactive account setup (npm start) once before docker compose up.
# Linux Docker: the web app keeps bridge isolation; only discovery joins the LAN.
services:
  watchlocal:
    image: node:24-bookworm-slim
    init: true
    user: "1000:1000" # Match the owner of data/ and data/discovery/ on the host.
    working_dir: /app
    command: ["node", "start.mjs"]
    restart: unless-stopped
    ports: ["8091:8091", "80:80"]
    environment:
      HOST: 0.0.0.0
      PORT: "8091"
      WATCHLOCAL_MDNS_MODE: external
      WATCHLOCAL_MDNS_STATUS_FILE: /app/data/discovery/status.json
    volumes: [".:/app:ro", "./data:/app/data"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  discovery:
    image: node:24-bookworm-slim
    init: true
    user: "1000:1000"
    network_mode: host
    working_dir: /app
    command: ["node", "discovery-companion.mjs"]
    restart: unless-stopped
    environment:
      WATCHLOCAL_DISCOVERY_ENDPOINT: http://127.0.0.1:8091/health
      WATCHLOCAL_MDNS_STATUS_FILE: /state/status.json
    volumes:
      - ./discovery-companion.mjs:/app/discovery-companion.mjs:ro
      - ./api/discovery.mjs:/app/api/discovery.mjs:ro
      - ./api/environment.mjs:/app/api/environment.mjs:ro
      - ./node_modules:/app/node_modules:ro
      - ./data/discovery:/state
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
