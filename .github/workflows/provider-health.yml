name: Provider health

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'automation/watch-bots/provider-index.json'
      - 'scripts/check-providers-live.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/provider-health.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'automation/watch-bots/provider-index.json'
      - 'scripts/check-providers-live.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/provider-health.yml'
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Provider contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.providers.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check scripts/check-providers-live.mjs
      - run: npm run check:private
      - run: npm run test:providers
      - run: npm run test:live
      - run: npm run test:sports
      - name: Build matrix from configured providers
        id: providers
        shell: bash
        run: echo "matrix=$(node scripts/check-providers-live.mjs --matrix)" >> "$GITHUB_OUTPUT"

  playback:
    name: Live playback / ${{ matrix.kind }} / ${{ matrix.provider }}
    needs: contracts
    if: ${{ needs.contracts.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contracts.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify public upstream and actual video bytes
        env:
          PROVIDER_KIND: ${{ matrix.kind }}
          PROVIDER_ID: ${{ matrix.provider }}
          DATA_DIR: ${{ runner.temp }}/watch-provider-health
        run: node scripts/check-providers-live.mjs --kind "$PROVIDER_KIND" --provider "$PROVIDER_ID"
